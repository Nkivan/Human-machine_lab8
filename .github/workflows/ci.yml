name: CI
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm # node_modules cache keyed by the package-lock.json hash
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint # type-checked rules, incl. no-floating-promises
      - run: npm run format:check
      - run: npm run test:coverage # unit + property + integration; fails if shared/ coverage < 85 %
      - run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
